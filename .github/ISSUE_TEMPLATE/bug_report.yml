name: Bug Report
description: Report an error, unexpected behavior, or broken feature in Verge Ledger
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible.
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe the problem you encountered.
      placeholder: The survey form crashed when saving...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Describe the expected behavior.
      placeholder: The segment should have been saved to local IndexedDB.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide step-by-step instructions.
      value: |
        1. Open the web app at /survey
        2. Draw a segment of 50 m
        3. Proceed to Step 4 and click Save
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, OS, and Browser
      description: E.g., Pixel 7 / Android 14 / Chrome 122, iPhone 14 / iOS 17 / Safari, Windows 11 / Firefox 123.
      placeholder: Android 14 / Chrome Mobile 122
    validations:
      required: true
  - type: textarea
    id: screenshots_logs
    attributes:
      label: Screenshots or console logs
      description: Paste any error messages or attach screenshots if available.
    validations:
      required: false
